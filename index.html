<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:'Nunito','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 70% -10%, #5a2d8a 0%, transparent 60%),
    radial-gradient(900px 500px at 10% 110%, #86308a 0%, transparent 55%),
    linear-gradient(180deg,#1c1042 0%, #33195e 55%, #45246e 100%);
  display:flex; justify-content:center;
  user-select:none; touch-action:manipulation;
}
#stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
.star { position:absolute; border-radius:50%; background:#fff; animation:tw 3s ease-in-out infinite; }
@keyframes tw { 0%,100%{opacity:.15; transform:scale(.7)} 50%{opacity:.9; transform:scale(1.15)} }

#app { position:relative; z-index:3; width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; }

/* ---------- HUD ---------- */
#hud { width:min(100%,720px); display:flex; align-items:center; gap:8px; padding:7px 10px 4px; }
.pill {
  color:#fff; font-weight:800; font-size:16px; white-space:nowrap;
  background:linear-gradient(180deg,#a052d8,#7a35b8);
  border:2px solid rgba(235,190,255,.7); border-radius:999px;
  padding:4px 12px; box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
#timerbar {
  position:relative; flex:1; height:26px; border-radius:999px; overflow:hidden;
  border:2px solid rgba(240,170,230,.85); background:#241040;
  box-shadow:0 0 10px rgba(230,120,210,.4), inset 0 2px 4px rgba(0,0,0,.5);
}
#timerfill { position:absolute; inset:0; background:linear-gradient(90deg,#ff4136,#ff8c1a,#ffe83d,#7ae04d,#2fe0c8); }
#timercover { position:absolute; top:0; right:0; bottom:0; width:0%; background:#241040; transition:width .25s linear; }
.icon-btn { width:38px; height:38px; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:linear-gradient(180deg,#a052d8,#7a35b8); border:2px solid rgba(235,190,255,.7); border-radius:50%;
  box-shadow:0 2px 6px rgba(0,0,0,.35); }
.icon-btn svg { width:20px; height:20px; }
.icon-btn:active { transform:scale(.92); }

/* ---------- Board ---------- */
#board-wrap { position:relative; margin:2px auto; border-radius:10px;
  border:3px solid #e0559a; background:rgba(30,10,50,.4);
  box-shadow:0 0 18px rgba(230,90,170,.4), inset 0 0 24px rgba(0,0,0,.35); }
#board { position:absolute; }
.tile {
  position:absolute; cursor:pointer; border-radius:5px;
  background:linear-gradient(180deg,#ffffff,#fdeef5);
  border:1.5px solid #f2a0c4;
  box-shadow:0 2px 2px rgba(40,10,60,.5), inset 0 1px 0 rgba(255,255,255,.9);
  display:flex; align-items:center; justify-content:center;
  transition:left .28s ease, top .28s ease, transform .15s ease, opacity .22s ease, box-shadow .15s ease;
  animation:dealIn .3s backwards;
}
@keyframes dealIn { from { transform:scale(0); opacity:0 } to { transform:scale(1); opacity:1 } }
.tile svg { width:95%; height:95%; pointer-events:none; }
.tile .mod { position:absolute; right:1px; top:1px; pointer-events:none; line-height:1;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
.tile.sel {
  transform:scale(1.1); z-index:3;
  box-shadow:0 0 0 3px #ffb830, 0 0 16px rgba(255,184,48,.85), 0 2px 4px rgba(0,0,0,.4);
  animation:bob .5s ease-in-out infinite alternate;
}
@keyframes bob { from{transform:scale(1.06)} to{transform:scale(1.13)} }
.tile.hint {
  z-index:4; border-color:#00b8f0;
  background:linear-gradient(180deg,#dff6ff,#b8ecff);
  animation:hintP .55s ease-in-out infinite;
}
@keyframes hintP {
  0%,100% { box-shadow:0 0 0 3px #00c8ff, 0 0 10px rgba(0,200,255,.8); transform:scale(1.02); }
  50%     { box-shadow:0 0 0 6px #ffb830, 0 0 26px rgba(0,220,255,1); transform:scale(1.14); }
}
.tile.bad {
  z-index:4; border-color:#e8302a;
  background:linear-gradient(180deg,#ffe4e2,#ffc9c5);
  animation:badP .45s ease-in-out, shk .45s;
}
@keyframes badP {
  0%,100% { box-shadow:0 0 0 3px #ff4136, 0 0 10px rgba(255,65,54,.7); }
  50%     { box-shadow:0 0 0 5px #ff4136, 0 0 24px rgba(255,65,54,1); }
}

.tile.dead { opacity:0; transform:scale(0) rotate(20deg); pointer-events:none; }

.float-txt { position:absolute; z-index:7; pointer-events:none; color:#ffe83d; font-weight:900; font-size:18px;
  text-shadow:0 2px 0 rgba(0,0,0,.5); animation:floatUp .9s ease-out forwards; }
@keyframes floatUp { from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-42px)} }

  color:#ff4d80; font-weight:900; font-size:clamp(38px,11vw,60px);
  text-shadow:0 3px 0 #fff, 0 0 22px rgba(255,255,255,.95), 0 0 40px rgba(255,120,180,.8), 0 7px 16px rgba(0,0,0,.4);
  animation:lilyPop 3s ease forwards; }
@keyframes lilyPop {
  0%   { transform:translate(-50%,-50%) scale(0);    opacity:0 }
  10%  { transform:translate(-50%,-50%) scale(1.35); opacity:1 }
  18%  { transform:translate(-50%,-50%) scale(1);    opacity:1 }
  45%  { transform:translate(-50%,-50%) scale(1.08); opacity:1 }
  84%  { transform:translate(-50%,-56%) scale(1);    opacity:1 }
  100% { transform:translate(-50%,-95%) scale(1.05); opacity:0 }
}
.lily-banner.gold { color:#ffb400;

  from { box-shadow:0 0 16px rgba(255,200,50,.55), inset 0 0 24px rgba(0,0,0,.35); }

}
/* hiệu ứng nổ bom */
.boom-flash { position:absolute; z-index:9; pointer-events:none; border-radius:50%;

  transform:translate(-50%,-50%) scale(.2); animation:boomF .55s ease-out forwards; }
@keyframes boomF {
  0%   { transform:translate(-50%,-50%) scale(.2);  opacity:1 }
  100% { transform:translate(-50%,-50%) scale(2.4); opacity:0 }
}
.spark { position:absolute; z-index:9; pointer-events:none; border-radius:50%;
  animation:sparkFly .65s ease-out forwards; }
@keyframes sparkFly {
  0%   { transform:translate(-50%,-50%) scale(1); opacity:1 }
  100% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.25); opacity:0 }
}
.boom-emo { position:absolute; z-index:10; pointer-events:none;
  transform:translate(-50%,-50%) scale(0);
  animation:boomE .6s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes boomE {
  0%   { transform:translate(-50%,-50%) scale(0);   opacity:1 }
  45%  { transform:translate(-50%,-50%) scale(1.5); opacity:1 }
  100% { transform:translate(-50%,-50%) scale(1.1); opacity:0 }
}
#board-wrap.quake { animation:quake .35s ease; }
@keyframes quake {
  0%,100% { translate:0 0 } 20% { translate:-5px 3px } 40% { translate:4px -3px }

}

.fly-clock { position:fixed; z-index:30; pointer-events:none;
  transition:left .7s cubic-bezier(.4,.1,.2,1), top .7s cubic-bezier(.4,.1,.2,1), transform .7s, opacity .7s;
  filter:drop-shadow(0 0 8px rgba(110,255,192,.9)); }
#timerbar.tpulse { animation:tpulse .8s ease; }
@keyframes tpulse {
  0%,100% { box-shadow:0 0 10px rgba(230,120,210,.4); }
  40%     { box-shadow:0 0 28px rgba(110,255,192,1); border-color:#6effc0; transform:scale(1.04); }
}

/* ---------- Controls ---------- */
#controls { display:flex; gap:8px; align-items:center; justify-content:center; padding:4px 8px; width:min(100%,720px); }
#controls .pill { font-size:14px; padding:5px 14px; cursor:pointer; }
button.pill:active { transform:scale(.94); }
button.pill:disabled { filter:grayscale(.8) brightness(.7); cursor:default; }
#score-box { background:linear-gradient(180deg,#4a2580,#331a5c); }
#score-box b { color:#ffe83d; }

/* ---------- Wave footer ---------- */
#wave { position:fixed; left:0; right:0; bottom:0; height:110px; z-index:0; pointer-events:none; overflow:hidden; }
#wave svg { position:absolute; bottom:0; left:0; width:200%; height:100%; }
#wave .w1 { animation:drift 9s linear infinite; opacity:.95; }
#wave .w2 { animation:drift 14s linear infinite reverse; opacity:.6; }
@keyframes drift { from{transform:translateX(0)} to{transform:translateX(-50%)} }
#slogan { position:fixed; left:0; right:0; bottom:3px; z-index:2; text-align:center; pointer-events:none;
  color:#fff; font-weight:900; font-size:clamp(13px,2.8vh,24px); letter-spacing:.5px;
  -webkit-text-stroke:1px #6a35a8; paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(80,40,130,.7), 0 6px 14px rgba(0,0,0,.35); }

/* ---------- Overlay ---------- */
#overlay { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
  background:rgba(4,10,36,.72); backdrop-filter:blur(3px); }
#overlay.show { display:flex; }
#card { text-align:center; padding:30px 40px; border-radius:22px;
  background:linear-gradient(180deg,#3a1e63,#241040);
  border:3px solid rgba(240,160,220,.8); box-shadow:0 0 40px rgba(220,100,200,.4);
  animation:dealIn .3s backwards; }
#card h1 { color:#fff; font-size:30px; margin-bottom:8px; text-shadow:0 3px 0 rgba(0,0,0,.4); }
#card p  { color:#d8bdf5; font-weight:700; margin-bottom:18px; }
#card p b { color:#ffe83d; font-size:20px; }
#card button { font-size:17px; padding:10px 28px; }
</style>

    o.connect(g).connect(a.destination);
    o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .02);
  }catch(e){}
}

  cs = Math.max(26, Math.min(96, Math.floor(Math.min(availW/(COLS+0.8), availH/(ROWS+0.8)))));
  PAD = Math.round(cs*0.4);
  const W = COLS*cs + 2*PAD, H = ROWS*cs + 2*PAD;
  wrapEl.style.width = W+'px'; wrapEl.style.height = H+'px';
  boardEl.style.left = PAD+'px'; boardEl.style.top = PAD+'px';
  boardEl.style.width = COLS*cs+'px'; boardEl.style.height = ROWS*cs+'px';
  const dpr = window.devicePixelRatio||1;
  fx.width = W*dpr; fx.height = H*dpr; fx.style.width = W+'px'; fx.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const cands = tiles.filter(t => !isSpecialT(t.type));
  shuffleArr(cands);
  if(cands[0]) cands[0].mod = 'bomb';
  if(cands[1]) cands[1].mod = 'bomb';
  if(cands[2]) cands[2].mod = 'clock';
  if(cands[3]) cands[3].mod = 'clock';
  cands.slice(0,4).forEach(renderTile);
  ensureSolvable(true);
  hints = 10; updHud();
  timeMax = Math.max(90, 160 - (level-1)*10);
  timeLeft = timeMax;
  levelStartScore = score;
  saveProgress();
  playing = true;
  if(level === 4)       toast('3 nhân vật mới xuất hiện!');
  else if(level === 6)  toast('5 nhân vật mới xuất hiện!');
  else if(level === 11) toast('4 nhân vật mới xuất hiện!');
  else if(erikHere)     toast('Erik ghé thăm ❤');
  clearInterval(timerId);
  timerId = setInterval(tick, 200);
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

/* ---------- Thuật toán nối (tối đa 2 lần rẽ) ---------- */
const empty = (r,c) => r>=0 && r<=ROWS+1 && c>=0 && c<=COLS+1 && !grid[r][c];
function clearRow(r,c1,c2){ const [a,b]=c1<c2?[c1,c2]:[c2,c1]; for(let c=a+1;c<b;c++) if(grid[r][c]) return false; return true; }
function clearCol(c,r1,r2){ const [a,b]=r1<r2?[r1,r2]:[r2,r1]; for(let r=a+1;r<b;r++) if(grid[r][c]) return false; return true; }
function connect(t1,t2){
  const {r:r1,c:c1} = t1, {r:r2,c:c2} = t2;
  // 0 rẽ
  if(r1===r2 && clearRow(r1,c1,c2)) return [[r1,c1],[r2,c2]];
  if(c1===c2 && clearCol(c1,r1,r2)) return [[r1,c1],[r2,c2]];
  // 1 rẽ
  if(empty(r1,c2) && clearRow(r1,c1,c2) && clearCol(c2,r1,r2)) return [[r1,c1],[r1,c2],[r2,c2]];
  if(empty(r2,c1) && clearCol(c1,r1,r2) && clearRow(r2,c1,c2)) return [[r1,c1],[r2,c1],[r2,c2]];
  // 2 rẽ — quét theo cột trung gian k
  for(let k=0; k<=COLS+1; k++){
    if(k===c1 || k===c2) continue;
    if(empty(r1,k) && empty(r2,k) && clearRow(r1,c1,k) && clearCol(k,r1,r2) && clearRow(r2,k,c2))
      return [[r1,c1],[r1,k],[r2,k],[r2,c2]];
  }
  // 2 rẽ — quét theo hàng trung gian k
  for(let k=0; k<=ROWS+1; k++){
    if(k===r1 || k===r2) continue;
    if(empty(k,c1) && empty(k,c2) && clearCol(c1,r1,k) && clearRow(k,c1,c2) && clearCol(c2,k,r2))
      return [[r1,c1],[k,c1],[k,c2],[r2,c2]];
  }
  return null;
}
function findPair(){
  const byType = {};
  for(const t of tiles) if(t.alive) (byType[t.type] ||= []).push(t);
  for(const k in byType){
    const arr = byType[k];
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      if(connect(arr[i],arr[j])) return [arr[i],arr[j]];
    }
  }
  return null;
}
function ensureSolvable(silent=false){
  let tries = 0;
  while(!findPair() && tiles.some(t=>t.alive) && tries++ < 80) reshuffle(false);
  if(tries>0 && !silent) toast('Hết nước đi — tự động xáo trộn!');
}
function reshuffle(anim=true){
  const alive = tiles.filter(t=>t.alive);
  const ts = alive.map(t=>t.type); shuffleArr(ts);
  alive.forEach((t,i)=>{
    t.type = ts[i]; renderTile(t);
    if(anim){ t.el.style.animation='none'; t.el.offsetHeight; t.el.style.animation='dealIn .3s backwards'; }
  });
  if(selected){ selected.el.classList.remove('sel'); selected = null; }
}

/* ---------- Dồn ô theo màn ---------- */
function applyShift(){
  const mode = SHIFTS[(level-1) % SHIFTS.length];
  if(mode==='none') return;
  const move = (list, positions) => {   // list: tile sống theo thứ tự dồn; positions: toạ độ đích
    list.forEach((t,i)=>{ grid[t.r][t.c] = null; });
    list.forEach((t,i)=>{ [t.r,t.c] = positions[i]; grid[t.r][t.c] = t; place(t); });
  };
  if(mode==='down' || mode==='up'){
    for(let c=1;c<=COLS;c++){
      const col = []; for(let r=1;r<=ROWS;r++) if(grid[r][c]) col.push(grid[r][c]);
      const pos = [];
      if(mode==='down') for(let i=0;i<col.length;i++) pos.push([ROWS-col.length+1+i, c]);
      else              for(let i=0;i<col.length;i++) pos.push([1+i, c]);
      move(col,pos);
    }
  } else {
    for(let r=1;r<=ROWS;r++){
      const row = []; for(let c=1;c<=COLS;c++) if(grid[r][c]) row.push(grid[r][c]);
      const pos = [];
      if(mode==='right') for(let i=0;i<row.length;i++) pos.push([r, COLS-row.length+1+i]);
      else               for(let i=0;i<row.length;i++) pos.push([r, 1+i]);
      move(row,pos);
    }
  }
}

/* ---------- Tương tác ---------- */
function onTile(t){
  if(!playing || locked || !t.alive) return;
  ac().resume && ac().resume();
  if(selected === t){ t.el.classList.remove('sel'); selected = null; return; }
  if(!selected){ selected = t; t.el.classList.add('sel'); sSelect(); return; }
  const a = selected;
  if(a.type === t.type){
    const path = connect(a,t);
    if(path){ doMatch(a,t,path); return; }
  }
  // chọn sai: âm báo lỗi + nháy đỏ cả 2 ô, bỏ chọn cả 2
  sFail();
  a.el.classList.remove('sel'); selected = null;
  [a,t].forEach(x => x.el.classList.add('bad'));
  setTimeout(()=> [a,t].forEach(x => x.el.classList.remove('bad')), 470);
}
function doMatch(a,b,path){
  locked = true;
  a.el.classList.remove('sel'); selected = null;
  drawPath(path); sMatch();
  const now = performance.now();
  combo = (now - lastMatchAt < 3000) ? combo+1 : 0;
  lastMatchAt = now;
  const isSpec = isSpecialT(a.type);
  const inFever = performance.now() < feverUntil;
  let pts = (isSpec ? 30 : 10) + combo*5;
  if(inFever) pts *= 2;
  score += pts;
  if(mode !== 'zen') timeLeft = Math.min(timeMax, timeLeft + (isSpec ? 5 : 2));
  if(isSpec){ sLily(); lilyBurst(a, b, pts, a.type >= ERIK ? 'Erik' : 'Lily'); }
  else floatText(b, '+' + pts + (inFever ? ' (x2)' : combo>0 ? '  x'+(combo+1) : ''));
  if(!inFever && combo >= 3) startFever();
  const bombs  = [a,b].filter(t => t.mod === 'bomb').length;
  const clocks = [a,b].filter(t => t.mod === 'clock').length;
  setTimeout(()=>{
    // hiệu ứng đồng hồ lấy vị trí ô TRƯỚC khi ô biến mất
    const clockTiles = [a,b].filter(t => t.mod === 'clock');
    clockTiles.forEach(ct => clockFx(ct, mode === 'zen' ? '+20' : '+15s'));
    if(clocks){
      sClock();
      if(mode === 'zen') score += 20*clocks;
      else timeLeft = Math.min(timeMax, timeLeft + 15*clocks);
    }
    const bombTiles = [a,b].filter(t => t.mod === 'bomb');
    kill(a); kill(b);
    bombTiles.forEach(bt => boomFx(bt));
    for(let i=0; i<bombs; i++) explodeRandomPair();
    applyShift();
    updHud();
    if(!tiles.some(t=>t.alive)){ winLevel(); }
    else setTimeout(()=>{ ensureSolvable(); locked = false; }, 300);
  }, 280);
}
function kill(t){
  t.alive = false; t.el.classList.add('dead');
  grid[t.r][t.c] = null;
}
function fxEl(cls, cx, cy, extra={}){
  const d = document.createElement('div');
  d.className = cls;
  d.style.left = cx+'px'; d.style.top = cy+'px';
  for(const [k,v] of Object.entries(extra)){
    if(k.startsWith('--')) d.style.setProperty(k, v); else d.style[k] = v;
  }
  wrapEl.appendChild(d); setTimeout(()=>d.remove(), 900);
  return d;
}
function boomFx(t){
  const [cx,cy] = center(t.r, t.c);
  fxEl('boom-flash', cx, cy, { width:cs*1.9+'px', height:cs*1.9+'px' });
  fxEl('boom-emo', cx, cy, { fontSize:Math.round(cs*.85)+'px' }).textContent = '💥';
  const cols = ['#ffd94a','#ff9d3c','#ff5a3c','#fff3b0'];
  for(let i=0; i<10; i++){
    const ang = Math.random()*Math.PI*2, dist = cs*(0.8 + Math.random()*1.3);
    const s = 4 + Math.random()*5;
    fxEl('spark', cx, cy, { width:s+'px', height:s+'px', background:cols[i%4],
      '--dx':Math.cos(ang)*dist+'px', '--dy':Math.sin(ang)*dist+'px' });
  }
  wrapEl.classList.remove('quake'); void wrapEl.offsetWidth;
  wrapEl.classList.add('quake');
  setTimeout(()=> wrapEl.classList.remove('quake'), 400);
}
function clockFx(t, label){
  const r = t.el.getBoundingClientRect();
  const target = (mode === 'zen' ? $('#score-box') : $('#timerbar')).getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'fly-clock'; d.textContent = '⏰';
  d.style.fontSize = '26px';
  d.style.left = (r.left + r.width/2 - 13) + 'px';
  d.style.top  = (r.top + r.height/2 - 15) + 'px';
  document.body.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    d.style.left = (target.left + target.width/2 - 13) + 'px';
    d.style.top  = (target.top + target.height/2 - 15) + 'px';
    d.style.transform = 'scale(.55) rotate(360deg)';
    d.style.opacity = '.9';
  }));
  setTimeout(()=>{
    d.remove();
    const tb = $('#timerbar');
    tb.classList.remove('tpulse'); void tb.offsetWidth; tb.classList.add('tpulse');
    setTimeout(()=> tb.classList.remove('tpulse'), 850);
  }, 720);
  const [cx,cy] = center(t.r, t.c);
  const s = fxEl('float-txt', cx-20, cy-cs/2-8, { color:'#6effc0' });
  s.textContent = '⏰ ' + label;
}
function explodeRandomPair(){
  const byType = {};
  for(const t of tiles) if(t.alive) (byType[t.type] ||= []).push(t);
  const groups = Object.values(byType).filter(g => g.length >= 2);
  if(!groups.length) return;
  sBomb();
  const g = groups[Math.floor(Math.random()*groups.length)];
  shuffleArr(g);
  setTimeout(()=>{
    [g[0], g[1]].forEach(t => { if(t.alive){ boomFx(t); kill(t); } });
    applyShift(); updHud();
    if(!tiles.some(x=>x.alive)) winLevel();
  }, 180);
  score += 10;
}
function startFever(){
  feverUntil = performance.now() + 10000;
  wrapEl.classList.add('fever');
  const ban = document.createElement('div');
  ban.className = 'lily-banner gold';
  ban.textContent = Math.random() < 0.5 ? 'Ngon 😌' : 'Được đấy 😌';
  wrapEl.appendChild(ban); setTimeout(()=>ban.remove(), 3050);
  sFever();
  setTimeout(()=>{ if(performance.now() >= feverUntil) wrapEl.classList.remove('fever'); }, 10100);
}
function drawPath(path){
  const pt = ([r,c]) => center(r,c);
  let alpha = 1;
  const render = () => {
    ctx.clearRect(0,0,fx.width,fx.height);
    if(alpha<=0) return;
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = '#2fe0ff'; ctx.shadowBlur = 14;
    ctx.strokeStyle = '#49e8ff'; ctx.lineWidth = Math.max(6, cs*.26);
    ctx.beginPath();
    path.forEach((p,i)=>{ const [x,y]=pt(p); i? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#d9fbff'; ctx.lineWidth = Math.max(2.5, cs*.09);
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  render();
  setTimeout(()=>{
    const fade = setInterval(()=>{ alpha -= .12; render(); if(alpha<=0) clearInterval(fade); }, 30);
  }, 260);
}
function lilyBurst(a, b, pts, name = 'Lily'){
  const ban = document.createElement('div');
  ban.className = 'lily-banner'; ban.textContent = '❤ ' + name + '! +' + pts;
  wrapEl.appendChild(ban); setTimeout(()=>ban.remove(), 3050);
  [a,b].forEach(t=>{
    const [cx,cy] = center(t.r, t.c);
    for(let i=0;i<6;i++){
      const h = document.createElement('div');
      h.className = 'heart-p'; h.textContent = '❤';
      h.style.left = (cx - 8 + (Math.random()*46 - 23)) + 'px';
      h.style.top  = (cy - 8 - Math.random()*10) + 'px';
      h.style.fontSize = (13 + Math.random()*11) + 'px';
      h.style.animationDelay = (Math.random()*.3) + 's';
      wrapEl.appendChild(h); setTimeout(()=>h.remove(), 1750);
    }
  });
}
function floatText(t, txt){
  const s = document.createElement('div');
  s.className = 'float-txt'; s.textContent = txt;
  const [fx0,fy0] = center(t.r, t.c);
  s.style.left = (fx0 - 18)+'px'; s.style.top = (fy0 - cs/2 - 8)+'px';
  wrapEl.appendChild(s); setTimeout(()=>s.remove(), 950);
}
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.style.opacity = 1;
  setTimeout(()=> el.style.opacity = 0, 1600);
}

/* ---------- Đồng hồ / HUD ---------- */
function tick(){
  if(!playing || mode === 'zen') return;
  timeLeft -= .2;
  $('#timercover').style.width = (100 - Math.max(0,timeLeft)/timeMax*100) + '%';
  if(timeLeft <= 0) gameOver();
}
function updHud(){
  $('#score').textContent = score;
  $('#level-badge').textContent = (mode === 'zen' ? 'Zen · ' : '') + 'Màn ' + level;
  $('#btn-hint').textContent = 'Gợi ý (' + hints + ')';
  $('#btn-hint').disabled = hints <= 0;
  $('#timercover').style.width = mode === 'zen'
    ? '0%'
    : (100 - Math.max(0,timeLeft)/Math.max(1,timeMax)*100) + '%';
}

/* ---------- Thắng / thua / menu ---------- */
function overlay(title, sub, btn, fn, btn2, fn2){
  $('#ov-title').textContent = title;
  $('#ov-sub').innerHTML = sub;
  const b = $('#ov-btn'); b.textContent = btn;
  b.onclick = ()=>{ $('#overlay').classList.remove('show'); fn(); };
  const b2 = $('#ov-btn2');
  if(btn2){
    b2.style.display = 'inline-block'; b2.textContent = btn2;
    b2.onclick = ()=>{ $('#overlay').classList.remove('show'); fn2(); };
  } else b2.style.display = 'none';
  $('#overlay').classList.add('show');
}
function startScreen(){
  playing = false; clearInterval(timerId);
  wrapEl.classList.remove('fever'); feverUntil = 0;
  const sv = loadProgress();
  if(sv && sv.level > 1){
    overlay('Game for Lily ❤',
      'Đang chơi dở: màn <b>' + sv.level + '</b>' + (sv.mode==='zen' ? ' (Zen)' : '') +
      ' · ' + (sv.score||0) + ' điểm · Kỷ lục: <b>' + best + '</b>',
      'Chơi tiếp màn ' + sv.level,
      ()=>{ mode = sv.mode || 'classic'; level = sv.level; score = sv.score || 0; combo = 0; buildLevel(); },
      'Chơi mới', chooseMode);
  } else chooseMode();
}
function chooseMode(){
  overlay('Game for Lily ❤', 'Kỷ lục: <b>' + best + '</b> điểm',
    'Chơi cổ điển', ()=>{ mode='classic'; level=1; score=0; combo=0; buildLevel(); },
    'Chế độ Zen',   ()=>{ mode='zen';     level=1; score=0; combo=0; buildLevel(); });
}
function winLevel(){
  playing = false; clearInterval(timerId);
  const bonus = mode === 'zen' ? 50 : Math.floor(timeLeft) * 2;
  score += bonus;
  saveBest(); updHud(); sWin();
  overlay('Chô! Qua màn ' + level + '!',
    'Thưởng +' + bonus + ' · Điểm: <b>' + score + '</b> · Kỷ lục: <b>' + best + '</b>',
    'Màn tiếp theo', ()=>{ level++; buildLevel(); });
}
function gameOver(){
  playing = false; clearInterval(timerId); sOver();
  wrapEl.classList.remove('fever'); feverUntil = 0;
  saveBest();
  overlay('Tèo rồi bạn ơi!',
    'Bạn đạt <b>' + score + '</b> điểm ở màn ' + level + ' · Kỷ lục: <b>' + best + '</b>',
    'Chơi lại màn ' + level, ()=>{ score = levelStartScore; combo = 0; buildLevel(); },
    'Menu', startScreen);
}

/* ---------- Nút ---------- */
$('#btn-hint').addEventListener('click', ()=>{
  if(!playing || hints<=0) return;
  const p = findPair();
  if(p){
    hints--; updHud();
    p.forEach(t=>t.el.classList.add('hint'));
    setTimeout(()=>p.forEach(t=>t.el.classList.remove('hint')), 2600);
  }
});
$('#btn-shuffle').addEventListener('click', ()=>{
  if(!playing || locked) return;
  reshuffle(true); ensureSolvable(true); toast('Đã xáo trộn!'); sSelect();
});
$('#btn-sound').addEventListener('click', ()=>{ muted = !muted; drawSoundIcon(); });

/* ---------- Toàn màn hình ---------- */
function drawFullIcon(){
  $('#btn-full').innerHTML = document.fullscreenElement
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 v5 H4 M15 4 v5 h5 M9 20 v-5 H4 M15 20 v-5 h5"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 V4 h5 M20 9 V4 h-5 M4 15 v5 h5 M20 15 v5 h-5"/></svg>`;
}
$('#btn-full').addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=> toast('Trình duyệt chặn toàn màn hình'));
});
document.addEventListener('fullscreenchange', ()=>{ drawFullIcon(); setTimeout(layout, 60); });

/* ---------- Sao nền ---------- */
(function stars(){
  const box = $('#stars');
  for(let i=0;i<70;i++){
    const s = document.createElement('span'); s.className = 'star';
    const sz = Math.random()*2.4 + .8;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    box.appendChild(s);
  }
})();

/* ---------- Khởi động ---------- */
// Đăng ký service worker để chơi offline (chỉ chạy khi host qua https, vd GitHub Pages)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
drawSoundIcon(); drawFullIcon();
window.addEventListener('resize', layout);
chooseOrient(); layout();
startScreen();

</script>
